syntax = "proto3";

// The request message: send a FEN string
message PositionRequest {
  string fen = 1;
}

// The response message: policy vector + value
message EvaluationResponse {
  repeated float policy = 1;
  float value = 2;
}

// The service: defines one RPC method
service Evaluator {
  rpc Evaluate(PositionRequest) returns (EvaluationResponse);
}

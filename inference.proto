syntax = "proto3";

package inference;

message PositionTensor {
    repeated float board_state = 1;
}

message BatchInferenceRequest {
    repeated PositionTensor positions = 1;
}

message EvaluationResult {
    repeated float policy_logits = 1;
    float value = 2;
}

message BatchInferenceResponse {
    repeated EvaluationResult evaluations = 1;
}

service InferenceService {
    rpc Evaluate(BatchInferenceRequest) returns (BatchInferenceResponse);
}